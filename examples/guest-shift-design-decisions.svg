  <g font-family="Arial,sans-serif" fill="#153b3b" font-size="15"><text x="64" y="522">Blurred background + quieter title</text><text x="444" y="522">Bold type + slanted manual mark</text><text x="824" y="522">Soft background + straight lime rule</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Guest Shift design directions and underline correction</title>
  <desc id="desc">Schematic comparison of hazy first option, lime second option, and a hybrid with a straight underline. No real person or logo is shown.</desc>
  <defs>
    <linearGradient id="bar" x2="1" y2="1"><stop stop-color="#251b20"/><stop offset=".55" stop-color="#74513c"/><stop offset="1" stop-color="#162b31"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1200" height="560" fill="#f2eee5"/>
  <text x="38" y="49" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153b3b">FEED 4:5  /  THREE DECISIONS</text>
  <g font-family="Arial,sans-serif" font-weight="700" fill="#153b3b" font-size="18">
    <text x="60" y="95">01  SOFT ATMOSPHERE</text><text x="440" y="95">02  BOLD + LIME</text><text x="820" y="95">03  HYBRID REVISION</text>
  </g>

    <rect x="0" y="316" width="300" height="59" fill="#352136" opacity=".9"/><text x="20" y="349" fill="#f2eee5" font-family="Arial,sans-serif" font-size="15">CYKAS  ·  20 OCT  ·  8 PM</text>
  </g>
